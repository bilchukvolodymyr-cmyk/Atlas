[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — personal work memory (stage 1: core + Claude parser)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=2.14"]
test = ["pytest>=8", "anthropic>=2.14"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
