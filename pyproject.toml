[project]
name = "atlas"
version = "0.0.1"
description = "Atlas — personal work memory (stage 0 core)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

[tool.setuptools.package-data]
atlas = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
